[package]
name = "semsitter-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Java CST with SemSitter semantics, served over JSONL to the SonarJava frontend."

[[bin]]
name = "semsitter-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-java = "0.23.5"
udg-gen = { git = "ssh://git@github.com/SonarSource/semsitter.git", rev = "d606e04b766dc4f506c20c3c37f26d1511b5f065", default-features = false, features = ["lang-java"] }
udg-family-jvm = { git = "ssh://git@github.com/SonarSource/semsitter.git", rev = "d606e04b766dc4f506c20c3c37f26d1511b5f065" }
udg-lang-sdk = { git = "ssh://git@github.com/SonarSource/semsitter.git", rev = "d606e04b766dc4f506c20c3c37f26d1511b5f065", features = ["unstable-sdk"] }
udg-semantic = { git = "ssh://git@github.com/SonarSource/semsitter.git", rev = "d606e04b766dc4f506c20c3c37f26d1511b5f065" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
