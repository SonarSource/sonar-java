name: Ruling Diff Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'its/ruling/src/test/resources/expected/**/*.sarif'
      # Uncomment to test action changes
      - '.github/workflows/ruling-diff-comment.yml'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Pull request number'
        required: true
        type: string
      base-sha:
        description: 'Base commit SHA for diff'
        required: true
        type: string
      head-sha:
        description: 'Head commit SHA for diff'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ruling-diff-comment:
    runs-on: warp-custom-ubuntu-24-04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: step-security/setup-uv@b49aac5576b90039e3e427495dda1a21aba6aaec # v10.3.3
        with:
          enable-cache: true

      - name: Get enhancer secrets
        id: secrets
        continue-on-error: true
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/portkey/code-quality/ruling-test-unification api_key | PORTKEY_API_KEY_OPENAI;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader role | ARTIFACTORY_ROLE;

      - name: Post ruling diff comment
        uses: SonarSource/core-languages-tooling-public/ruling-diff-comment@master
        with:
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
          repository: ${{ github.repository }}
          base-sha: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          head-sha: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
          sources-root: 'its/sources'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSPY_MODEL: gpt-6-luna
          PORTKEY_API_KEY_OPENAI: ${{ fromJSON(steps.secrets.outputs.vault || '{}').PORTKEY_API_KEY_OPENAI }}
          UV_INDEX_REPOX_USERNAME: ${{ steps.secrets.outputs.vault && format('vault-{0}', fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ROLE) || '' }}
          UV_INDEX_REPOX_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault || '{}').ARTIFACTORY_ACCESS_TOKEN }}
