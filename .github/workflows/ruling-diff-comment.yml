name: Ruling Diff Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'its/ruling/src/test/resources/expected/**/*.sarif'
      # Uncomment to test action changes
      - '.github/workflows/ruling-diff-comment.yml'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Pull request number'
        required: true
        type: string
      base-sha:
        description: 'Base commit SHA for diff'
        required: true
        type: string
      head-sha:
        description: 'Head commit SHA for diff'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ruling-diff-comment:
    runs-on: warp-custom-ubuntu-24-04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: step-security/setup-uv@b49aac5576b90039e3e427495dda1a21aba6aaec # v10.3.3
        with:
          enable-cache: true

      - name: Post ruling diff comment
        uses: SonarSource/core-languages-tooling-public/ruling-diff-comment@d23bc854d3d4c58fae40d2058ba9f704f460dab3
        with:
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
          repository: ${{ github.repository }}
          base-sha: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          head-sha: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
          sources-root: 'its/sources'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
