name: Apache Maven Build Cache
description: Restore Maven module results for one CI job

inputs:
  namespace:
    description: CI job identity
    required: true

outputs:
  key:
    description: Key to save after the job succeeds
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Identify cache environment
      id: key
      shell: bash
      env:
        CACHE_NAMESPACE: ${{ inputs.namespace }}
        CONFIG_HASH: ${{ hashFiles('.mvn/extensions.xml', '.mvn/maven-build-cache-config.xml') }}
        POM_HASH: ${{ hashFiles('**/pom.xml', 'docs/java-custom-rules-example/pom_SQ_10_6_LATEST.xml') }}
      run: |
        runtime_hash="$({ java --version; mvn --version; } | sha256sum | cut -c1-16)"
        base="apache-maven-build-cache-1.3.0-${CACHE_NAMESPACE}-${RUNNER_OS}-${RUNNER_ARCH}-${runtime_hash}-${CONFIG_HASH}"
        echo "key=${base}-${POM_HASH}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        echo "pom_prefix=${base}-${POM_HASH}-" >> "$GITHUB_OUTPUT"
        echo "config_prefix=${base}-" >> "$GITHUB_OUTPUT"
    - name: Restore Apache Maven build cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.m2/build-cache
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.pom_prefix }}
          ${{ steps.key.outputs.config_prefix }}
