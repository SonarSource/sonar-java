name: Setup Orchestrator Cache
description: Sets up orchestrator cache

inputs:
  sq-version:
    description: 'SonarQube version. If DEV, cache will be disabled.'
    required: true

runs:
  using: composite
  steps:
    - name: Set Orchestrator Cache Variables
      shell: bash
      run: mise run orchestrator-cache-vars

    - name: Cache Orchestrator
      if: github.event_name != 'pull_request' && inputs.sq-version != 'DEV'
      uses: SonarSource/gh-action_cache@v1
      with:
        path: ${{ env.ORCHESTRATOR_HOME }}
        key: orchestrator-production-${{ inputs.sq-version }}-${{ env.ORCHESTRATOR_CACHE_KEY }}-${{ github.run_id }}
        restore-keys: orchestrator-production-${{ inputs.sq-version }}-${{ env.ORCHESTRATOR_CACHE_KEY }}-

    - name: Setup Orchestrator Home Directory
      shell: bash
      run: mise run orchestrator-home
